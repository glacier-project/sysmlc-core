[tox]
requires =
    tox>=4
    tox-uv>=1.15
env_list =
    py{312,313}
    formatter
    type
    coverage
    docs
skip_missing_interpreters = true

[testenv]
description = run the tests with pytest
runner = uv-venv-lock-runner
extras = dev
pass_env =
    SYSIDE_LICENSE_KEY
    SYSIDE_LICENSE_KEY_FILE
commands =
    {envpython} -m pytest {posargs:tests}

[testenv:lf]
description = compile and run generated Lingua Franca programs (needs lfc + Java)
runner = uv-venv-lock-runner
extras = dev
pass_env =
    SYSIDE_LICENSE_KEY
    SYSIDE_LICENSE_KEY_FILE
commands =
    {envpython} -m pytest -m lf {posargs:tests}

[testenv:fmu]
description = compile and run generated Frost FMU co-simulations (needs lfc + Java + a Frost checkout)
runner = uv-venv-runner
extras =
    dev
    fmi
deps =
    LinguaFrancaBase
    machine-data-model @ git+https://github.com/glacier-project/machine-data-model.git@dev
pass_env =
    SYSIDE_LICENSE_KEY
    SYSIDE_LICENSE_KEY_FILE
    SYSMLC_FROST_PATH
commands =
    {envpython} -m pytest -m fmu {posargs:tests}

[testenv:type]
description = run type checks
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m mypy {posargs:sysmlc tests examples}

[testenv:formatter]
description = run linter
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m ruff check --fix {posargs:sysmlc tests examples}
    {envpython} -m ruff format {posargs:sysmlc tests examples}

[testenv:coverage]
description = run coverage report
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m pytest --cov=sysmlc --cov-report=term-missing {posargs:tests}

[testenv:docs]
description = build the documentation site
runner = uv-venv-lock-runner
extras = dev
commands =
    {envpython} -m mkdocs build --strict
