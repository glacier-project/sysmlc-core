site_name: sysmlc
site_description: From SysML v2 models to Frost simulations of industrial plants
repo_name: sysmlc
theme:
  name: material
  features:
  - navigation.sections
  - navigation.indexes
  - content.code.copy
  - search.suggest
  - search.highlight

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          heading_level: 2
          show_root_heading: true
          show_root_full_path: false
          show_root_toc_entry: false
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          separate_signature: true
          show_signature_annotations: true
          merge_init_into_class: true
          inherited_members: true
          members_order: source

nav:
- Home: index.md
- API Reference: api.md

# Some docs link to repo source files outside docs/ (e.g.
# ../models/**/*.sysml). Those are not documentation pages, so mkdocs cannot
# resolve them as internal links; keep --strict from aborting on them.
validation:
  links:
    not_found: ignore

markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
