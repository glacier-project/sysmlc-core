# Example configuration for the batch reactor: a sped-up single-batch
# recipe (handy for simulation runs and the test bench). Build with:
#
#   sysmlc rosetta build models/showcase/batch-reactor \
#     -e BatchReactor::BatchReactor \
#     --values models/showcase/batch-reactor/values.yaml
BatchReactor:
  BatchReactor:
    batchTarget: 1
    inflowRate: 60.0
    heatRate: 65.0
    coolRate: 60.0
    drainRate: 60.0
    sampleTime: "0.5 [s]"
