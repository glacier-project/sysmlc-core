# Example configuration for the milling workcell. Nesting mirrors
# qualified names (package -> state def -> attribute). Build with:
#
#   sysmlc rosetta build models/showcase/milling-workcell \
#     -e MillingWorkcell::MillingWorkcell \
#     --values models/showcase/milling-workcell/values.yaml
MillingWorkcell:
  MillingWorkcell:
    batchSize: 2
    toolWearLimit: 30.0
    retryDelay: "1 [s]"
